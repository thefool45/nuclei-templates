name: 🔄 Sync & Alert on new Nuclei templates

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.yaml'
      - '**/*.yml'
  schedule:
    - cron: '*/5 * * * *'     # every 5 minutes
  workflow_dispatch:         # manual trigger

permissions:
  contents: write            # so GITHUB_TOKEN can push

jobs:
  sync-and-alert:
    runs-on: ubuntu-latest
    steps:

      # 1) Check out your fork, full history + creds so we can push
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 2) Configure Git so merges get a valid committer
      - name: Configure Git
        run: |
          git config --global user.name  "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      # 3) Add upstream remote & fetch its main
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/projectdiscovery/nuclei-templates.git || true
          git fetch upstream main

      # 4) Figure out which templates upstream has added since last time
      - name: Find newly added templates
        id: find_new
        run: |
          git diff --name-status origin/main..upstream/main \
            | awk '$1=="A" && /\.ya?ml$/{print $2}' \
            > new_templates.txt || true
          echo "count=$(wc -l < new_templates.txt)" >> $GITHUB_OUTPUT

      # 5) Merge in whatever upstream/main has (won’t touch your .github/ or scripts/)
      - name: Merge & push upstream changes
        run: |
          git merge --no-edit upstream/main
          git push origin main

      # 6) Install Python & deps
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install packages
        run: pip install pyyaml requests

      # 7) If there were any new templates, ping Discord
      - name: Notify Discord
        if: steps.find_new.outputs.count != '0'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          while read -r tpl; do
            python .github/scripts/notify.py "$tpl"
          done < new_templates.txt