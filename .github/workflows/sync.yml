name: 🔄 Sync & Alert

on:
  push:
    branches: [main]
    paths:
      - '**/*.yaml'
      - '**/*.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-alert:
    runs-on: ubuntu-latest
    steps:
      # 1) Check out your fork, full history + creds so we can push
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 2) Configure Git so commits have a valid author
      - name: Configure Git user
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      # 3) Add upstream remote & fetch its main branch
      - name: Fetch upstream/main
        run: |
          git remote add upstream https://github.com/projectdiscovery/nuclei-templates.git || true
          git fetch upstream main

      # 4) Detect any .yaml/.yml that upstream has but origin doesn't (new or restored)
      - name: Detect upstream template additions
        id: detect
        run: |
          git diff --name-status origin/main..upstream/main \
            | awk '($1=="A"||$1=="M") && /\.ya?ml$/{print $1":"$2}' \
            > changes.txt || true
          echo "count=$(wc -l < changes.txt)" >> $GITHUB_OUTPUT

      # 5) For each of those files, check them out & commit them
      - name: Sync templates from upstream
        if: steps.detect.outputs.count != '0'
        run: |
          # get just the file paths
          awk '{print}' changes.txt > files.txt
          # restore them from upstream
          git checkout upstream/main -- $(cat files.txt)
          git add $(cat files.txt)
          git commit -m "chore: sync templates from upstream" || echo "No changes to commit"
          git push origin main

      # 6) Set up Python to run notifier
      - name: Set up Python & deps
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Python packages
        run: pip install pyyaml requests

      # 7) Finally, send a Discord alert for each restored/added template
      - name: Notify Discord
        if: steps.detect.outputs.count != '0'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          while read -r change; do
            status=${change%%:*} 
            tpl=${change#*:}
            python .github/scripts/notify.py "$status" "$tpl"
          done < changes.txt