name: 🔄 Sync & Alert

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.yaml'
      - '**/*.yml'
  schedule:
    - cron: '*/5 * * * *'    # every 5 minutes
  workflow_dispatch:         # manual trigger

permissions:
  contents: write            # grant GITHUB_TOKEN push rights

jobs:
  sync-and-alert:
    runs-on: ubuntu-latest
    steps:
      # 1) Checkout your fork (full history + credentials)
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 2) Configure Git user
      - name: Configure Git user
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      # 3) Add upstream remote & fetch main branch
      - name: Add & fetch upstream
        run: |
          git remote add upstream https://github.com/projectdiscovery/nuclei-templates.git || true
          git fetch upstream main

      # 4) Detect new or modified templates before merge
      - name: Detect upstream template changes
        id: detect
        run: |
          git diff --name-status origin/main..upstream/main \
            | awk '($1=="A" || $1=="M") && $2 ~ /\.ya?ml$/ {print $1 ":" $2}' \
            > changes.txt || true
          echo "count=$(wc -l < changes.txt)" >> $GITHUB_OUTPUT

      # 5) Merge upstream while protecting specific files
      - name: Merge upstream (protect sync.yaml & notify.py)
        run: |
          git merge --no-commit --no-ff upstream/main || true

          # Favor upstream by default
          git checkout --theirs . || true

          # Restore our protected files
          PROTECT_PATHS=(
            ".github/workflows/sync.yaml"
            ".github/scripts/notify.py"
          )

          for p in "${PROTECT_PATHS[@]}"; do
            if [ -f "$p" ]; then
              git checkout --ours -- "$p" || true
              git add -- "$p" || true
            elif [ -f ".git/ORIG_HEAD" ]; then
              # Try to restore from previous commit if deleted
              git show HEAD:"$p" > "$p" 2>/dev/null && git add -- "$p" || true
            fi
          done

          # Remove any unmerged files that cause issues
          git ls-files --unmerged | cut -f2 | sort -u | xargs -r git rm --cached || true

          # Stage all remaining changes
          git add -A

          # Commit only if there are staged changes
          if ! git diff --cached --quiet; then
            git commit -m "Merge upstream (protect sync.yaml & notify.py)"
            git push origin main
          else
            echo "No changes to commit"
          fi

      # 6) Setup Python for notification script
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml requests

      # 7) Notify Discord for each change
      - name: Notify Discord
        if: steps.detect.outputs.count != '0'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_FLYSEC: ${{ secrets.DISCORD_WEBHOOK_FLYSEC }}
          SHODAN_KEY: ${{ secrets.SHODAN_KEY }}
        run: |
          while read -r change; do
            status=${change%%:*}
            tpl=${change#*:}
            [ -f "$tpl" ] || { echo "Skipping missing $tpl"; continue; }
            python .github/scripts/notify.py "$status" "$tpl"
          done < changes.txt